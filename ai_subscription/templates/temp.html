        <form id="aiSubscriptionForm" data-id="{{ sub.pk }}" class="space-y-8">
            {% csrf_token %}

            <section class="glass-panel p-8">
                <div class="flex items-center mb-6 border-l-4 border-indigo-600 pl-4">
                    <h2 class="text-xl font-bold text-gray-800">订阅人信息</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">订阅人姓名</label>
                        <input type="text" name="user_name" value="{{ sub.user_name }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none input-focus-effect text-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">接收邮箱 (Email)</label>
                        <input type="email" name="user_email" value="{{ sub.user_email }}" required class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none input-focus-effect text-lg">
                    </div>
                </div>
            </section>

            <section class="glass-panel p-8">
                <div class="flex items-center mb-6 border-l-4 border-indigo-600 pl-4">
                    <h2 class="text-xl font-bold text-gray-800">订阅名称</h2>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">简报名称</label>
                    <input type="text" name="report_title" value="{{ sub.report_title }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 outline-none text-lg" readonly>
                </div>
            </section>

            <section class="glass-panel p-8">
                <div class="flex items-center mb-6 border-l-4 border-indigo-600 pl-4">
                    <h2 class="text-xl font-bold text-gray-800">核心订阅逻辑</h2>
                </div>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">关注关键词</label>
                        <input type="text" name="keywords" value="{{ sub.keywords }}" class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none input-focus-effect text-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">详细内容描述</label>
                        <textarea name="description" rows="10" class="w-full px-4 py-4 border border-gray-300 rounded-lg outline-none input-focus-effect text-base resize-y">{{ sub.description }}</textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">已上传的参考资料</label>
                        <div id="fileList" class="mt-3 space-y-2">
                            {% for doc in sub.documents.all %}
                            <div class="flex items-center justify-between p-2 bg-green-50 text-green-700 text-sm rounded border border-green-100">
                                <span>📄 {{ doc.file.name }}</span>
                                <a href="{{ doc.file.url }}" target="_blank" class="text-blue-600 underline ml-auto mr-4">预览</a>
                            </div>
                            {% endfor %}
                        </div>
                        <div id="dropZone" class="mt-4 drop-zone p-4 rounded-lg text-center cursor-pointer bg-gray-50 border-dashed border-2">
                            <input type="file" id="fileInput" name="attachments" class="hidden" multiple>
                            <p class="text-sm text-gray-500 font-bold">+ 添加更多文件</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="glass-panel p-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-3">生成周期</label>
                        <select name="period" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                            <option value="daily" {% if sub.period == 'daily' %}selected{% endif %}>每日汇总</option>
                            <option value="weekly" {% if sub.period == 'weekly' %}selected{% endif %}>每周复盘</option>
                            <option value="realtime" {% if sub.period == 'realtime' %}selected{% endif %}>实时推送</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-3">发送时间</label>
                        <input type="time" name="send_time" value="{{ sub.send_time|time:'H:i' }}" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-3">输出格式</label>
                        <div class="space-y-2 text-sm">
                            <label><input type="radio" name="format" value="markdown" {% if sub.format_type == 'markdown' %}checked{% endif %}> Markdown</label><br>
                            <label><input type="radio" name="format" value="pdf" {% if sub.format_type == 'pdf' %}checked{% endif %}> PDF 附件</label>
                        </div>
                    </div>
                </div>
            </section>

            <div class="pb-12 text-center">
                <button type="submit" class="bg-indigo-600 text-white px-16 py-4 rounded-xl font-black text-xl hover:bg-indigo-700 transition transform hover:scale-105">
                    更新订阅配置
                </button>
            </div>
        </form>
