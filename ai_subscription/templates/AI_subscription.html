{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 定制简报订阅 - 宽屏版</title>
    <link href="{% static 'css/tailwind.min.css' %}" rel="stylesheet">
    <style>
        body { background-color: #f4f7fa; }
        .glass-panel {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .input-focus-effect {
            transition: all 0.2s ease-in-out;
        }
        .input-focus-effect:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        /* 新增：拖拽区域样式 */
        .drop-zone {
            border: 2px dashed #e5e7eb;
            transition: all 0.3s ease;
        }
        .drop-zone.active {
            border-color: #4f46e5;
            background-color: #f5f3ff;
        }
    </style>
    <button onclick="subs_manage()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-indigo-700 transition">
        返回订阅管理中心
    </button>
</head>
<body class="py-12 px-4 md:px-0">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black text-gray-900 tracking-tight">AI 简报深度定制</h1>
            <p class="mt-3 text-lg text-gray-600">更宽的视野，更精准的情报</p>
        </header>
        <form id="aiSubscriptionForm" class="space-y-8">
            {% csrf_token %}
            
            <section class="glass-panel p-8">
                <div class="flex items-center justify-between mb-6 border-l-4 border-indigo-600 pl-4">
                    <h2 class="text-xl font-bold text-gray-800">订阅接收者列表</h2>
                    <button type="button" onclick="addEmailField()" class="text-sm bg-indigo-50 text-indigo-600 px-3 py-1 rounded-md font-bold hover:bg-indigo-100">
                        + 添加接收人
                    </button>
                </div>
                <div id="emailContainer" class="space-y-4">
                    <div class="flex gap-3 items-center">
                        <input type="email" name="recipient_emails[]" required placeholder="接收邮箱 (example@company.com)" 
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none input-focus-effect text-lg">
                        <div class="w-10"></div> 
                    </div>
                </div>
            </section>

            <section class="glass-panel p-8">
                <div class="flex items-center mb-6 border-l-4 border-indigo-600 pl-4">
                    <h2 class="text-xl font-bold text-gray-800">订阅名称</h2>
                </div>
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">简报名称</label>
                        <input type="text" name="report_title" placeholder="例如：大模型技术前哨 / 每日 AI 投融资简讯" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none input-focus-effect text-lg">
                    </div>
                </div>
            </section>

            <section class="glass-panel p-8">
                <div class="flex items-center mb-6 border-l-4 border-indigo-600 pl-4">
                    <h2 class="text-xl font-bold text-gray-800">核心订阅逻辑</h2>
                </div>
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">关注关键词 (用逗号分隔)</label>
                        <input type="text" name="keywords" placeholder="Agentic Workflow, RAG, Llama 3, 具身智能" 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none input-focus-effect text-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2 text-flex justify-between">
                            <span>详细内容描述</span>
                            <span class="text-xs font-normal text-gray-400">支持输入超长文本，系统将深度解析需求</span>
                        </label>
                        <textarea name="description" rows="10" 
                                  placeholder="请详细说明你希望 AI 捕捉的信息。&#10;1. 具体的应用场景？&#10;2. 排除哪些噪音信息？&#10;3. 是否需要特定公司的动态？" 
                                  class="w-full px-4 py-4 border border-gray-300 rounded-lg outline-none input-focus-effect text-base leading-relaxed resize-y"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">客户参考资料文档 (PDF/Word/TXT)</label>
                        <div id="dropZone" class="drop-zone p-8 rounded-lg text-center cursor-pointer bg-gray-50 hover:bg-gray-100 transition-all">
                            <input type="file" id="fileInput" name="attachments" class="hidden" multiple accept=".pdf,.doc,.docx,.txt">
                            <div class="text-gray-500">
                                <svg class="w-10 h-10 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <p class="text-sm">点击或拖拽文件至此处上传参考资料</p>
                            </div>
                        </div>
                        <div id="fileList" name="attachments" class="mt-3 space-y-2"></div>
                    </div>
                </div>
            </section>

            <section class="glass-panel p-8">
                <div class="flex items-center mb-6 border-l-4 border-indigo-600 pl-4">
                    <h2 class="text-xl font-bold text-gray-800">交付设置</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-3">生成周期</label>
                        <select name="period" class="w-full px-3 py-2 border border-gray-300 rounded-md outline-none bg-white">
                            <option value="daily">每日汇总</option>
                            <option value="weekly">每周复盘</option>
                            <option value="monthly">每月总结</option>
                            <option value="quarterly">季度深挖</option>
                            <option value="yearly">年度汇报</option>
                            <option value="realtime">实时推送</option>
                        </select>
                        <input type="time" name="send_time" value="09:00" class="mt-3 w-full px-3 py-2 border border-gray-300 rounded-md outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-3">数据来源参考</label>
                        <div class="space-y-2 max-h-32 overflow-y-auto pr-2">
                            <label class="flex items-center text-sm text-gray-600"><input type="checkbox" checked class="mr-2 rounded text-indigo-600"> arXiv 论文库</label>
                            <label class="flex items-center text-sm text-gray-600"><input type="checkbox" checked class="mr-2 rounded text-indigo-600"> GitHub 热门</label>
                            <label class="flex items-center text-sm text-gray-600"><input type="checkbox" class="mr-2 rounded text-indigo-600"> 行业新闻媒体</label>
                            <label class="flex items-center text-sm text-gray-600"><input type="checkbox" class="mr-2 rounded text-indigo-600"> 社交媒体讨论</label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-3">输出格式模板</label>
                        <div class="space-y-2">
                            <label class="flex items-center text-sm text-gray-600"><input type="radio" name="format" checked class="mr-2 text-indigo-600" value="markdown"> Markdown (邮件正文)</label>
                            {% comment %} <label class="flex items-center text-sm text-gray-600"><input type="radio" name="format" class="mr-2 text-indigo-600" value="pdf"> PDF 附件报告</label> {% endcomment %}
                            <label class="flex items-center text-sm text-gray-600"><input type="radio" name="format" class="mr-2 text-indigo-600" value="json"> JSON (API 对接)</label>
                        </div>
                    </div>
                </div>
                <div class="mb-6 flex items-center justify-between p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                    <div>
                        <h3 class="text-sm font-bold text-indigo-900">激活订阅状态</h3>
                        <p class="text-xs text-indigo-600">关闭后将暂停生成和发送报告</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="is_active" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                    </label>
                </div>
            </section>
            <div class="pb-12 text-center">
                <button type="submit" 
                        class="bg-indigo-600 text-white px-16 py-4 rounded-xl font-black text-xl hover:bg-indigo-700 shadow-2xl transition transform hover:scale-105 active:scale-95">
                    启动我的 AI 情报系统
                </button>
                <p class="mt-4 text-sm text-gray-400">配置完成后，系统将在选定时间点自动发送第一份简报</p>
            </div>
        </form>
    </div>

    <script src="{% static 'js/api_client.js' %}"></script>
    <script>
        // Initialize ApiClient if needed (global instance is already available as ApiClient)
        const periodSelect = document.querySelector('select[name="period"]');
        const timeInput = document.querySelector('input[name="send_time"]');
        periodSelect.addEventListener('change', function() {
            if (this.value === 'realtime') {
                timeInput.style.opacity = '0.5';
                timeInput.style.pointerEvents = 'none';
                timeInput.parentElement.querySelector('label').innerText = "生成周期 (实时模式无需设置时间)";
            } else {
                timeInput.style.opacity = '1';
                timeInput.style.pointerEvents = 'auto';
                timeInput.parentElement.querySelector('label').innerText = "生成周期";
            }
        });
        // 处理文件上传交互逻辑
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('active'); };
        dropZone.ondragleave = () => dropZone.classList.remove('active');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            updateFileList(e.dataTransfer.files);
        };

        fileInput.onchange = (e) => updateFileList(e.target.files);

        function subs_manage() {
            window.location.href = "{% url 'ai_subscription:subs_manage' %}";
        }

        function addEmailField() {
            const container = document.getElementById('emailContainer');
            const div = document.createElement('div');
            div.className = "flex gap-3 items-center animate-fade-in mt-4"; // 这里的 class 可以自选
            div.innerHTML = `
                <input type="email" name="recipient_emails[]" required placeholder="接收邮箱" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none input-focus-effect text-lg">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 p-2 hover:text-red-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            `;
            container.appendChild(div);
        }        

        function updateFileList(files) {
            for (let file of files) {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 bg-indigo-50 text-indigo-700 text-sm rounded border border-indigo-100";
                div.innerHTML = `
                    <div class="flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)
                    </div>
                    <button type="button" class="text-red-500 hover:font-bold" onclick="this.parentElement.remove()">删除</button>
                `;
                //`<span>📄 ${file.name}</span><button type="button" class="text-red-500 hover:font-bold" onclick="this.parentElement.remove()">删除</button>`;
                fileList.appendChild(div);
            }
        }


        // 修改后的提交逻辑
        document.getElementById('aiSubscriptionForm').onsubmit = async function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            try {
                // Allows ApiClient to handle CSRF and Content-Type for us
                const result = await ApiClient.post("{% url 'ai_subscription:subscribe_api' %}", formData);
                
                if (result.status === 'success' || result.success) {
                    alert('安全订阅成功！');
                    subs_manage();
                } else {
                    alert('订阅失败: ' + (result.message || '未知错误'));
                }
            } catch (error) {
                console.error('提交失败:', error);
                alert('提交异常，请稍后重试');
            }
        };
    </script>
</body>
</html>
