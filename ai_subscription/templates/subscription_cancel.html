{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>取消确认 - AI 订阅</title>
    <link href="{% static 'css/tailwind.min.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">确认取消订阅？</h1>
            <p class="mt-2 text-gray-500 text-sm">
                您正在注销 <span class="font-bold text-gray-800">“{{ object.report_title }}”</span>。
                此操作将永久移除数据库记录并销毁所有关联的参考文档。
            </p>
        </div>

        <form method="post" class="space-y-3">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold hover:bg-red-700 transition transform active:scale-95">
                确认永久删除
            </button>
            <a href="{% url 'ai_subscription:subs_manage' %}" class="block w-full text-center py-3 text-gray-400 hover:text-gray-600 font-medium">
                我再想想，先不删
            </a>
        </form>
    </div>
</body>
</html>
