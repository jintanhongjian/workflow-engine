<!DOCTYPE html>
<html>
<head>
    <title>密码修改成功</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-family: 'Segoe UI', sans-serif; 
            margin: 0;
        }
        .card {
            background: white; 
            padding: 40px; 
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 350px;
            text-align: center;
        }
        .icon-success {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }
        h2 { 
            color: #2d3436; 
            margin-top: 0; 
            font-size: 1.5rem;
        }
        p { 
            color: #636e72; 
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .btn-save {
            display: block;
            background: #4a90e2; 
            color: white; 
            padding: 12px;
            border: none; 
            border-radius: 6px; 
            font-size: 1rem; 
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .btn-save:hover {
            background: #357abd;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon-success">✅</span>
        <h2>密码修改成功</h2>
        <p>您的新密码已生效，<br>请在下次登录时使用新密码。</p>
        
        <a href="{% url 'ai_subscription:subs_manage' %}" class="btn-save">返回订阅管理</a>
    </div>
</body>
</html>
