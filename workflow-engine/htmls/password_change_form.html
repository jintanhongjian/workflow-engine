<!DOCTYPE html>
<html>
<head>
    <title>修改密码 - LMI OA</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; margin: 0;
        }
        .card {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
        }
        h2 { color: #2d3436; margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #636e72; font-size: 0.9rem; }
        /* 这里的 input 选择器针对 Django 渲染的表单 */
        .form-group input {
            width: 100%; padding: 10px; border: 1px solid #dfe6e9;
            border-radius: 6px; box-sizing: border-box;
        }
        .btn-save {
            width: 100%; background: #4a90e2; color: white; padding: 12px;
            border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 10px;
        }
        .help-text { font-size: 0.8rem; color: #b2bec3; margin-top: 5px; }
        .errorlist { color: #ff4757; font-size: 0.85rem; padding-left: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>安全中心 - 修改密码</h2>
        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <div class="help-text">{{ field.help_text|safe }}</div>
                    {% endif %}
                    {{ field.errors }}
                </div>
            {% endfor %}
            
            <button type="submit" class="btn-save">立即更新密码</button>
            <div style="text-align: center; margin-top: 15px;">
                <a href="{% url 'ai_subscription:subs_manage' %}" style="color: #747d8c; text-decoration: none; font-size: 0.9rem;">返回管理后台</a>
            </div>
        </form>
    </div>
</body>
</html>
